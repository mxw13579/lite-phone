<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PR3测试 - 数据库模块</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <h1>PR3测试：数据库模块验证</h1>
    <div id="test-results">测试中...</div>
    
    <script type="module" src="./main.js"></script>
    
    <script>
        setTimeout(async () => {
            const output = document.getElementById('test-results');
            let results = [];
            
            // 测试1: window.DB对象存在
            if (window.DB) {
                results.push('✅ window.DB 对象存在');
            } else {
                results.push('❌ window.DB 对象不存在');
                output.innerHTML = results.join('<br>');
                return;
            }
            
            // 测试2: 数据库实例
            if (window.DB.db && window.DB.db.name === 'GeminiChatDB') {
                results.push('✅ Dexie数据库实例正确');
            } else {
                results.push('❌ Dexie数据库实例不正确');
            }
            
            // 测试3: 关键函数存在
            const dbFunctions = [
                'initializeDatabase',
                'loadAllDataFromDB'
            ];
            let funcCount = 0;
            dbFunctions.forEach(func => {
                if (typeof window.DB[func] === 'function') {
                    funcCount++;
                }
            });
            results.push(`✅ 数据库函数: ${funcCount}/${dbFunctions.length} 个可用`);
            
            // 测试4: 尝试调用loadAllDataFromDB
            try {
                const dbData = await window.DB.loadAllDataFromDB();
                if (dbData && typeof dbData === 'object') {
                    results.push('✅ loadAllDataFromDB 函数调用成功');
                    
                    // 检查返回数据结构
                    const expectedKeys = [
                        'chats', 'apiConfig', 'globalSettings', 
                        'userStickers', 'worldBooks', 'musicLibrary',
                        'personaPresets', 'presets'
                    ];
                    let keyCount = 0;
                    expectedKeys.forEach(key => {
                        if (key in dbData) {
                            keyCount++;
                        }
                    });
                    results.push(`✅ 数据结构完整性: ${keyCount}/${expectedKeys.length} 个键存在`);
                    
                } else {
                    results.push('❌ loadAllDataFromDB 返回数据格式不正确');
                }
            } catch (error) {
                results.push('❌ loadAllDataFromDB 调用失败: ' + error.message);
            }
            
            // 测试5: 数据库表存在性验证
            if (window.DB.db && window.DB.db.tables) {
                const tableNames = window.DB.db.tables.map(t => t.name);
                const expectedTables = [
                    'chats', 'apiConfig', 'globalSettings',
                    'userStickers', 'worldBooks', 'musicLibrary',
                    'personaPresets', 'presets'
                ];
                let tableCount = 0;
                expectedTables.forEach(table => {
                    if (tableNames.includes(table)) {
                        tableCount++;
                    }
                });
                results.push(`✅ 数据库表: ${tableCount}/${expectedTables.length} 个表存在`);
            }
            
            output.innerHTML = results.join('<br>');
        }, 2000);
    </script>
</body>
</html>
