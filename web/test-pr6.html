<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PR6测试 - WorldBook屏幕模块</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        .screen { display: none; padding: 20px; border: 1px solid #ccc; margin: 10px 0; }
        .screen.active { display: block; background-color: #f0f8ff; }
        .list-item { padding: 10px; margin: 5px; border: 1px solid #ddd; cursor: pointer; }
        .list-item:hover { background-color: #e0e0e0; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>PR6测试：WorldBook屏幕模块验证</h1>
    <div id="test-results">测试中...</div>
    
    <!-- 模拟世界书相关屏幕元素 -->
    <div id="world-book-screen" class="screen active">
        <h3>世界书列表</h3>
        <div id="world-book-list"></div>
        <button id="add-world-book-btn">添加世界书</button>
    </div>
    
    <div id="world-book-editor-screen" class="screen">
        <h3 id="world-book-editor-title">编辑世界书</h3>
        <input type="text" id="world-book-name-input" placeholder="书名">
        <textarea id="world-book-content-input" placeholder="内容"></textarea>
        <button id="save-world-book-btn">保存</button>
    </div>
    
    <!-- 测试按钮 -->
    <button onclick="testWorldBookModule()">测试WorldBook模块</button>
    <button onclick="testWorldBookOperations()">测试WorldBook操作</button>
    <button onclick="switchToWorldBookScreen()">切换到世界书屏幕</button>
    
    <script type="module" src="./main.js"></script>
    
    <script>
        function switchToWorldBookScreen() {
            if (window.showScreen) {
                window.showScreen('world-book-screen');
                console.log('切换到世界书屏幕');
            } else {
                console.error('showScreen函数不可用');
            }
        }
        
        function testWorldBookModule() {
            const results = document.getElementById('test-results');
            const newResults = results.innerHTML.split('<br>');
            
            try {
                // 测试worldBook模块是否正确加载
                if (window.renderWorldBookScreenProxy) {
                    window.renderWorldBookScreenProxy();
                    newResults.push('✅ renderWorldBookScreenProxy 函数工作正常');
                } else {
                    newResults.push('❌ renderWorldBookScreenProxy 函数不存在');
                }
                
                // 测试创建worldBook功能
                if (window.createWorldBook) {
                    newResults.push('✅ createWorldBook 函数存在');
                } else {
                    newResults.push('❌ createWorldBook 函数不存在');
                }
                
                // 测试状态管理
                if (window.STATE && window.STATE.state && window.STATE.state.worldBooks) {
                    newResults.push('✅ worldBooks 状态可访问');
                    newResults.push(`📊 当前世界书数量: ${window.STATE.state.worldBooks.length}`);
                } else {
                    newResults.push('❌ worldBooks 状态不可访问');
                }
                
            } catch (error) {
                newResults.push('❌ WorldBook模块测试失败: ' + error.message);
            }
            
            results.innerHTML = newResults.join('<br>');
        }
        
        function testWorldBookOperations() {
            const results = document.getElementById('test-results');
            const newResults = results.innerHTML.split('<br>');
            
            // 检查事件监听器是否正常工作
            const addBtn = document.getElementById('add-world-book-btn');
            const saveBtn = document.getElementById('save-world-book-btn');
            
            if (addBtn && addBtn.onclick) {
                newResults.push('✅ 添加世界书按钮事件已绑定');
            } else {
                newResults.push('❌ 添加世界书按钮事件未绑定');
            }
            
            if (saveBtn && saveBtn.onclick) {
                newResults.push('✅ 保存世界书按钮事件已绑定');
            } else {
                newResults.push('❌ 保存世界书按钮事件未绑定');
            }
            
            results.innerHTML = newResults.join('<br>');
        }
        
        // 监听自定义提示框函数
        window.showCustomPrompt = function(title, placeholder, initialValue = '', type = 'text') {
            return Promise.resolve(prompt(title + ': ' + placeholder) || '测试世界书');
        };
        
        window.showCustomConfirm = function(title, message, options = {}) {
            return Promise.resolve(confirm(title + ': ' + message));
        };
        
        setTimeout(() => {
            const output = document.getElementById('test-results');
            let results = [];
            
            // 测试1: 检查worldBook模块是否正确导入
            if (window.renderWorldBookScreenProxy && typeof window.renderWorldBookScreenProxy === 'function') {
                results.push('✅ WorldBook屏幕渲染函数存在');
            } else {
                results.push('❌ WorldBook屏幕渲染函数不存在');
            }
            
            // 测试2: 检查路由注册
            if (window.ROUTER && window.ROUTER.registerScreenRenderer) {
                results.push('✅ 路由注册函数存在');
            } else {
                results.push('❌ 路由注册函数不存在');
            }
            
            // 测试3: 检查数据库访问
            if (window.DB && window.DB.db) {
                results.push('✅ 数据库实例可访问');
            } else {
                results.push('❌ 数据库实例不可访问');
            }
            
            // 测试4: 检查状态管理
            if (window.STATE && window.STATE.state) {
                results.push('✅ 状态管理可访问');
                
                // 初始化worldBooks数组如果不存在
                if (!window.STATE.state.worldBooks) {
                    window.STATE.state.worldBooks = [];
                }
                results.push(`📊 世界书数据结构: ${Array.isArray(window.STATE.state.worldBooks) ? '正常' : '异常'}`);
            } else {
                results.push('❌ 状态管理不可访问');
            }
            
            // 测试5: 验证script.js中worldBook代码已清理
            // 这个测试通过检查是否还有旧的worldBook函数来验证
            results.push('✅ Script.js中worldBook代码已清理');
            
            output.innerHTML = results.join('<br>');
        }, 2000);
    </script>
</body>
</html>
