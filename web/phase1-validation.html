<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 1 Validation - EPhone</title>
    <link rel="stylesheet" href="unified-style.css">
    <link rel="stylesheet" href="js/components/components.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        .validation-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .validation-item {
            margin: 1rem 0;
            padding: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }
        
        .validation-item.success {
            border-color: var(--color-success);
            background: rgba(40, 167, 69, 0.1);
        }
        
        .validation-item.error {
            border-color: var(--color-danger);
            background: rgba(220, 53, 69, 0.1);
        }
        
        .console-output {
            background: #1e1e1e;
            color: #ffffff;
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-family-mono);
            font-size: var(--font-size-sm);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .demo-section {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body>
    <div class="validation-container">
        <h1>EPhone - 第一阶段基础架构验证</h1>
        
        <div class="validation-item">
            <h3>验证控制台</h3>
            <div id="console" class="console-output">等待验证开始...</div>
        </div>
        
        <div class="demo-section">
            <h3>组件系统演示</h3>
            <div id="component-demo"></div>
        </div>
        
        <div class="demo-section">
            <h3>事件系统演示</h3>
            <div id="event-demo"></div>
        </div>
        
        <button id="start-validation" class="btn btn-primary">开始验证</button>
        <button id="demo-components" class="btn btn-secondary">演示组件</button>
        <button id="demo-events" class="btn btn-info">演示事件</button>
    </div>

    <script type="module">
        // 重定向console到页面
        const consoleDiv = document.getElementById('console');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = {
                log: '📝',
                error: '❌', 
                warn: '⚠️'
            }[type];
            
            consoleDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'log');
        };
        
        console.error = (...args) => {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };
        
        console.warn = (...args) => {
            originalWarn.apply(console, args);
            addToConsole(args.join(' '), 'warn');
        };

        // 验证按钮事件
        document.getElementById('start-validation').addEventListener('click', async () => {
            consoleDiv.textContent = '开始第一阶段验证...\n';
            
            try {
                const { runPhase1Validation } = await import('./js/validation/phase1-validation.js');
                await runPhase1Validation();
            } catch (error) {
                console.error('验证脚本加载失败:', error);
            }
        });

        // 组件演示
        document.getElementById('demo-components').addEventListener('click', async () => {
            try {
                const { Button, Card, Modal, Form, Tag } = await import('./js/components/index.js');
                const demoDiv = document.getElementById('component-demo');
                demoDiv.innerHTML = '';
                
                // 演示按钮
                const btn1 = Button({ text: '主要按钮', type: 'primary' });
                const btn2 = Button({ text: '次要按钮', type: 'secondary' });
                const btn3 = Button({ text: '危险按钮', type: 'danger' });
                
                demoDiv.appendChild(btn1);
                demoDiv.appendChild(btn2);
                demoDiv.appendChild(btn3);
                
                // 演示标签
                const tag1 = Tag({ text: '成功', type: 'success' });
                const tag2 = Tag({ text: '警告', type: 'warning' });
                const tag3 = Tag({ text: '可关闭', type: 'info', closable: true });
                
                const tagContainer = document.createElement('div');
                tagContainer.style.marginTop = '1rem';
                tagContainer.appendChild(tag1);
                tagContainer.appendChild(tag2);
                tagContainer.appendChild(tag3);
                demoDiv.appendChild(tagContainer);
                
                // 演示卡片
                const card = Card({
                    title: '示例卡片',
                    content: '这是一个使用组件系统创建的卡片，展示了标题、内容和操作按钮。',
                    actions: [
                        Button({ text: '确定', type: 'primary' }),
                        Button({ text: '取消', type: 'secondary' })
                    ]
                });
                
                card.style.marginTop = '1rem';
                demoDiv.appendChild(card);
                
                console.log('组件演示已加载');
                
            } catch (error) {
                console.error('组件演示失败:', error);
            }
        });

        // 事件系统演示
        document.getElementById('demo-events').addEventListener('click', async () => {
            try {
                const { EnhancedEventBus } = await import('./js/core/enhanced-event-bus.js');
                const { validateEventPayload } = await import('./js/types/events.js');
                
                const eventBus = new EnhancedEventBus();
                eventBus.setDebug(true);
                
                // 注册事件监听器
                eventBus.on('demo.test', (data) => {
                    console.log('收到演示事件:', data);
                });
                
                // 发送测试事件
                await eventBus.emit('demo.test', {
                    timestamp: Date.now(),
                    message: '这是一个测试事件'
                });
                
                // 测试类型验证
                const testPayload = {
                    timestamp: Date.now(),
                    chatId: 'demo_chat',
                    message: { content: 'Hello World' },
                    senderId: 'demo_user'
                };
                
                const isValid = validateEventPayload('CHAT_MESSAGE_SENT', testPayload);
                console.log('事件载荷验证结果:', isValid ? '通过' : '失败');
                
                // 发送标准化事件
                await eventBus.emitStandard('app.ready', {
                    loadTime: 1500,
                    modules: ['events', 'components', 'database']
                });
                
                const demoDiv = document.getElementById('event-demo');
                demoDiv.innerHTML = '<p>✅ 事件系统演示完成，请查看控制台输出</p>';
                
            } catch (error) {
                console.error('事件系统演示失败:', error);
            }
        });
        
        console.log('第一阶段验证页面已加载');
    </script>
</body>
</html>
