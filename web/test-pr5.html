<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PR5测试 - 路由模块</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        .screen { display: none; padding: 20px; border: 1px solid #ccc; margin: 10px 0; }
        .screen.active { display: block; background-color: #f0f8ff; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>PR5测试：路由模块验证</h1>
    <div id="test-results">测试中...</div>
    
    <!-- 模拟屏幕元素 -->
    <div id="home-screen" class="screen active">主屏幕</div>
    <div id="chat-list-screen" class="screen">聊天列表屏幕</div>
    <div id="api-settings-screen" class="screen">API设置屏幕</div>
    <div id="world-book-screen" class="screen">世界书屏幕</div>
    
    <!-- 路由测试按钮 -->
    <button onclick="testScreenSwitch('home-screen')">主屏幕</button>
    <button onclick="testScreenSwitch('chat-list-screen')">聊天列表</button>
    <button onclick="testScreenSwitch('api-settings-screen')">API设置</button>
    <button onclick="testScreenSwitch('world-book-screen')">世界书</button>
    <button onclick="testNavigationFunctions()">测试导航函数</button>
    
    <script type="module" src="./main.js"></script>
    
    <script>
        function testScreenSwitch(screenId) {
            if (window.showScreen) {
                window.showScreen(screenId);
                console.log('切换到屏幕:', screenId);
            } else {
                console.error('showScreen函数不可用');
            }
        }
        
        function testNavigationFunctions() {
            const results = document.getElementById('test-results');
            const newResults = results.innerHTML.split('<br>');
            
            try {
                // 测试导航函数
                if (window.ROUTER) {
                    if (typeof window.ROUTER.navigateToChatList === 'function') {
                        window.ROUTER.navigateToChatList();
                        newResults.push('✅ navigateToChatList 函数工作正常');
                    }
                    
                    if (typeof window.ROUTER.getCurrentScreen === 'function') {
                        const currentScreen = window.ROUTER.getCurrentScreen();
                        newResults.push(`✅ 当前屏幕: ${currentScreen}`);
                    }
                } else {
                    newResults.push('❌ ROUTER对象不存在');
                }
            } catch (error) {
                newResults.push('❌ 导航函数测试失败: ' + error.message);
            }
            
            results.innerHTML = newResults.join('<br>');
        }
        
        setTimeout(() => {
            const output = document.getElementById('test-results');
            let results = [];
            
            // 测试1: window.ROUTER对象存在
            if (window.ROUTER) {
                results.push('✅ window.ROUTER 对象存在');
            } else {
                results.push('❌ window.ROUTER 对象不存在');
                output.innerHTML = results.join('<br>');
                return;
            }
            
            // 测试2: showScreen全局函数
            if (typeof window.showScreen === 'function') {
                results.push('✅ 全局 showScreen 函数存在');
            } else {
                results.push('❌ 全局 showScreen 函数不存在');
            }
            
            // 测试3: 屏幕ID常量
            if (window.ROUTER.SCREEN_IDS) {
                const screenIds = Object.keys(window.ROUTER.SCREEN_IDS);
                results.push(`✅ 屏幕ID常量: ${screenIds.length} 个定义`);
            } else {
                results.push('❌ 屏幕ID常量不存在');
            }
            
            // 测试4: 路由管理函数
            const routerFunctions = [
                'showScreen',
                'getCurrentScreen',
                'navigateToChat',
                'navigateToChatList',
                'initRouter'
            ];
            let funcCount = 0;
            routerFunctions.forEach(func => {
                if (typeof window.ROUTER[func] === 'function') {
                    funcCount++;
                }
            });
            results.push(`✅ 路由函数: ${funcCount}/${routerFunctions.length} 个可用`);
            
            // 测试5: 屏幕切换功能
            try {
                // 测试切换到不同屏幕
                window.showScreen('api-settings-screen');
                const activeScreen = document.querySelector('.screen.active');
                if (activeScreen && activeScreen.id === 'api-settings-screen') {
                    results.push('✅ 屏幕切换功能正常');
                } else {
                    results.push('❌ 屏幕切换功能异常');
                }
                
                // 切回主屏幕
                window.showScreen('home-screen');
            } catch (error) {
                results.push('❌ 屏幕切换测试失败: ' + error.message);
            }
            
            // 测试6: 代理函数映射
            const proxyFunctions = [
                'renderChatListProxy',
                'renderApiSettingsProxy', 
                'renderWorldBookScreenProxy'
            ];
            let proxyCount = 0;
            proxyFunctions.forEach(proxy => {
                if (typeof window[proxy] === 'function') {
                    proxyCount++;
                }
            });
            results.push(`✅ 代理函数: ${proxyCount}/${proxyFunctions.length} 个可用`);
            
            output.innerHTML = results.join('<br>');
        }, 2000);
    </script>
</body>
</html>
