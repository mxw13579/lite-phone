<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>最小化测试</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <div id="test-output">测试中...</div>
    
    <!-- 简化的屏幕元素来测试showScreen -->
    <div class="screen" id="home-screen">Home Screen</div>
    <div class="screen" id="chat-list-screen">Chat List Screen</div>
    
    <script type="module" src="./main.js"></script>
    
    <script>
        // 延迟测试确保main.js加载完成
        setTimeout(() => {
            const output = document.getElementById('test-output');
            let results = [];
            
            // 测试1: showScreen函数存在
            if (typeof showScreen === 'function') {
                results.push('✅ showScreen函数存在');
            } else {
                results.push('❌ showScreen函数不存在');
            }
            
            // 测试2: 代理函数存在
            const proxies = ['renderChatListProxy', 'renderApiSettingsProxy', 'renderWorldBookScreenProxy'];
            let proxyCount = 0;
            proxies.forEach(p => {
                if (typeof window[p] === 'function') {
                    proxyCount++;
                }
            });
            results.push(`✅ 代理函数: ${proxyCount}/${proxies.length} 个可用`);
            
            // 测试3: Dexie可用
            if (typeof Dexie !== 'undefined') {
                results.push('✅ Dexie数据库库可用');
            } else {
                results.push('❌ Dexie数据库库不可用');
            }
            
            output.innerHTML = results.join('<br>');
        }, 1000);
    </script>
</body>
</html>
