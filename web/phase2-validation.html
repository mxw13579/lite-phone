<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 2 Validation - EPhone Core Systems</title>
    <link rel="stylesheet" href="unified-style.css">
    <link rel="stylesheet" href="js/components/components.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        .validation-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .validation-item {
            margin: 1rem 0;
            padding: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }
        
        .validation-item.success {
            border-color: var(--color-success);
            background: rgba(40, 167, 69, 0.1);
        }
        
        .validation-item.error {
            border-color: var(--color-danger);
            background: rgba(220, 53, 69, 0.1);
        }
        
        .validation-item.warning {
            border-color: var(--color-warning);
            background: rgba(255, 193, 7, 0.1);
        }
        
        .console-output {
            background: #1e1e1e;
            color: #ffffff;
            padding: 1rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-family-mono);
            font-size: var(--font-size-sm);
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        
        .demo-section {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
        }
        
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .demo-card {
            padding: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-bg-secondary);
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        
        .status-indicator.success { background: var(--color-success); }
        .status-indicator.error { background: var(--color-danger); }
        .status-indicator.warning { background: var(--color-warning); }
        .status-indicator.pending { background: var(--color-muted); }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--color-bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        
        .progress-bar .progress {
            height: 100%;
            background: var(--color-primary);
            transition: width 0.3s ease;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        
        .stat-card {
            padding: 1rem;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-sm);
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--color-primary);
        }
        
        .stat-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }
        
        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .performance-chart {
            margin: 1rem 0;
            padding: 1rem;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-sm);
        }
        
        .phase-header {
            text-align: center;
            margin: 2rem 0;
            padding: 2rem;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            color: white;
            border-radius: var(--radius-lg);
        }
        
        .phase-header h1 {
            margin: 0;
            font-size: 2rem;
        }
        
        .phase-header p {
            margin: 0.5rem 0 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="validation-container">
        <div class="phase-header">
            <h1>🚀 EPhone - 第二阶段核心系统验证</h1>
            <p>插件安全隔离 • AI行为执行器 • 权限管理系统 • 事件集成</p>
        </div>
        
        <div class="validation-item">
            <h3>🖥️ 验证控制台</h3>
            <div id="console" class="console-output">等待验证开始...</div>
        </div>
        
        <div class="demo-section">
            <h3>📊 系统状态监控</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="plugin-count">-</div>
                    <div class="stat-label">活跃插件</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="permission-cache">-</div>
                    <div class="stat-label">权限缓存</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="behavior-actions">-</div>
                    <div class="stat-label">行为动作</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="event-listeners">-</div>
                    <div class="stat-label">事件监听</div>
                </div>
            </div>
        </div>
        
        <div class="demo-grid">
            <div class="demo-section">
                <h3>🔐 插件安全演示</h3>
                <div id="plugin-demo">
                    <p>演示插件沙箱执行和配额管理</p>
                    <div id="plugin-status"></div>
                </div>
            </div>
            
            <div class="demo-section">
                <h3>🤖 行为执行演示</h3>
                <div id="behavior-demo">
                    <p>演示AI自动化行为执行</p>
                    <div id="behavior-status"></div>
                </div>
            </div>
            
            <div class="demo-section">
                <h3>🛡️ 权限控制演示</h3>
                <div id="permission-demo">
                    <p>演示内容访问权限控制</p>
                    <div id="permission-status"></div>
                </div>
            </div>
            
            <div class="demo-section">
                <h3>📡 事件集成演示</h3>
                <div id="event-demo">
                    <p>演示系统间事件通信</p>
                    <div id="event-status"></div>
                </div>
            </div>
        </div>
        
        <div class="demo-section">
            <h3>⚡ 性能测试结果</h3>
            <div id="performance-results" class="performance-chart">
                <p>点击"性能测试"按钮查看系统性能指标</p>
            </div>
        </div>
        
        <div class="validation-item">
            <h3>🎯 验证结果总览</h3>
            <div id="results-summary">
                <div class="progress-bar">
                    <div class="progress" id="overall-progress" style="width: 0%"></div>
                </div>
                <div id="results-details" style="margin-top: 1rem;">
                    <p>尚未开始验证</p>
                </div>
            </div>
        </div>
        
        <div class="button-group">
            <button id="start-validation" class="btn btn-primary btn-lg">🚀 开始验证</button>
            <button id="performance-test" class="btn btn-info">⏱️ 性能测试</button>
            <button id="demo-plugin" class="btn btn-secondary">📦 插件演示</button>
            <button id="demo-behavior" class="btn btn-secondary">🤖 行为演示</button>
            <button id="demo-permission" class="btn btn-secondary">🔒 权限演示</button>
            <button id="reset-all" class="btn btn-outline">🔄 重置</button>
        </div>
    </div>

    <script type="module">
        // 重定向console到页面
        const consoleDiv = document.getElementById('console');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = {
                log: '📝',
                error: '❌', 
                warn: '⚠️'
            }[type];
            
            consoleDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'log');
        };
        
        console.error = (...args) => {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };
        
        console.warn = (...args) => {
            originalWarn.apply(console, args);
            addToConsole(args.join(' '), 'warn');
        };

        // 更新状态指示器
        function updateStatusIndicator(elementId, status, message) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            const statusClass = status === 'success' ? 'success' : 
                               status === 'error' ? 'error' : 
                               status === 'warning' ? 'warning' : 'pending';
            
            element.innerHTML = `
                <span class="status-indicator ${statusClass}"></span>
                ${message}
            `;
        }
        
        // 更新统计数据
        async function updateStats() {
            try {
                // 这里需要导入相关模块来获取实际统计数据
                // 暂时使用模拟数据
                document.getElementById('plugin-count').textContent = '4';
                document.getElementById('permission-cache').textContent = '23';
                document.getElementById('behavior-actions').textContent = '12';
                document.getElementById('event-listeners').textContent = '8';
            } catch (error) {
                console.warn('无法获取实时统计数据:', error.message);
            }
        }
        
        // 更新进度条和结果
        function updateResults(results) {
            const progressBar = document.getElementById('overall-progress');
            const detailsDiv = document.getElementById('results-details');
            
            if (!results) return;
            
            const items = Object.entries(results);
            const passedCount = items.filter(([_, passed]) => passed).length;
            const progressPercent = (passedCount / items.length) * 100;
            
            progressBar.style.width = `${progressPercent}%`;
            
            const detailsHTML = items.map(([key, passed]) => {
                const statusClass = passed ? 'success' : 'error';
                const statusIcon = passed ? '✅' : '❌';
                const testName = getTestDisplayName(key);
                return `<div><span class="status-indicator ${statusClass}"></span>${statusIcon} ${testName}</div>`;
            }).join('');
            
            detailsDiv.innerHTML = detailsHTML;
        }
        
        function getTestDisplayName(key) {
            const names = {
                pluginSecurity: '插件安全隔离',
                behaviorExecution: 'AI行为执行器',
                permissionSystem: '权限管理系统',
                eventIntegration: '系统事件集成'
            };
            return names[key] || key;
        }

        // 主验证按钮
        document.getElementById('start-validation').addEventListener('click', async () => {
            consoleDiv.textContent = '开始第二阶段系统验证...\n';
            
            const button = document.getElementById('start-validation');
            button.disabled = true;
            button.textContent = '验证中...';
            
            try {
                const { runPhase2Validation } = await import('./js/validation/phase2-validation.js');
                const results = await runPhase2Validation();
                
                updateResults(results.results);
                updateStats();
                
                if (results.success) {
                    button.className = 'btn btn-success btn-lg';
                    button.textContent = '✅ 验证完成';
                } else {
                    button.className = 'btn btn-warning btn-lg';
                    button.textContent = '⚠️ 部分失败';
                }
                
            } catch (error) {
                console.error('验证脚本加载失败:', error);
                button.className = 'btn btn-danger btn-lg';
                button.textContent = '❌ 验证失败';
            }
            
            button.disabled = false;
        });

        // 性能测试按钮
        document.getElementById('performance-test').addEventListener('click', async () => {
            try {
                const { runPhase2PerformanceTest } = await import('./js/validation/phase2-validation.js');
                
                const resultsDiv = document.getElementById('performance-results');
                resultsDiv.innerHTML = '<p>⏱️ 运行性能测试中...</p>';
                
                const results = await runPhase2PerformanceTest();
                
                if (results.success) {
                    const { pluginExecutionTime, permissionCheckTime, batchPermissionTime } = results.results;
                    resultsDiv.innerHTML = `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value">${pluginExecutionTime.toFixed(1)}ms</div>
                                <div class="stat-label">插件执行时间</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${permissionCheckTime.toFixed(1)}ms</div>
                                <div class="stat-label">权限检查(100次)</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${batchPermissionTime.toFixed(1)}ms</div>
                                <div class="stat-label">批量权限检查(50项)</div>
                            </div>
                        </div>
                        <p style="text-align: center; margin-top: 1rem; color: var(--color-text-secondary);">
                            性能测试完成，所有指标均在合理范围内
                        </p>
                    `;
                } else {
                    resultsDiv.innerHTML = `<p style="color: var(--color-danger);">❌ 性能测试失败: ${results.error}</p>`;
                }
                
            } catch (error) {
                console.error('性能测试失败:', error);
                document.getElementById('performance-results').innerHTML = 
                    `<p style="color: var(--color-danger);">❌ 性能测试失败: ${error.message}</p>`;
            }
        });

        // 插件演示
        document.getElementById('demo-plugin').addEventListener('click', async () => {
            updateStatusIndicator('plugin-status', 'pending', '正在演示插件沙箱执行...');
            
            try {
                const { pluginManager } = await import('./js/services/plugins/secure-manager.js');
                
                const testCode = `
                    api.log('插件开始执行');
                    const result = {
                        timestamp: api.time.now(),
                        message: '插件执行成功！',
                        randomValue: Math.floor(Math.random() * 100)
                    };
                    api.log('插件执行完成');
                    return result;
                `;
                
                const result = await pluginManager.executePlugin('demo-plugin', testCode);
                
                if (result.success) {
                    updateStatusIndicator('plugin-status', 'success', 
                        `插件执行成功！耗时: ${result.executionTime}ms`);
                    console.log('插件返回结果:', result.result);
                } else {
                    updateStatusIndicator('plugin-status', 'error', 
                        `插件执行失败: ${result.error}`);
                }
                
            } catch (error) {
                updateStatusIndicator('plugin-status', 'error', `插件演示失败: ${error.message}`);
                console.error('插件演示错误:', error);
            }
        });

        // 行为执行演示
        document.getElementById('demo-behavior').addEventListener('click', async () => {
            updateStatusIndicator('behavior-status', 'pending', '正在演示AI行为执行...');
            
            try {
                const { eventBus } = await import('./js/core/event-bus.js');
                
                // 模拟AI行为建议
                const behaviorSuggestion = {
                    type: 'chat.proactive_message',
                    priority: 'low',
                    confidence: 0.7,
                    context: {
                        chatId: 'demo_chat',
                        trigger: 'user_idle_demo'
                    },
                    action: {
                        content: '你好！我注意到你在测试系统功能，有什么需要帮助的吗？',
                        delay: 500
                    }
                };
                
                await eventBus.emit('behavior.action-suggested', behaviorSuggestion);
                
                setTimeout(() => {
                    updateStatusIndicator('behavior-status', 'success', 
                        'AI行为执行演示完成（已发送主动消息建议）');
                }, 600);
                
            } catch (error) {
                updateStatusIndicator('behavior-status', 'error', `行为执行演示失败: ${error.message}`);
                console.error('行为执行演示错误:', error);
            }
        });

        // 权限控制演示
        document.getElementById('demo-permission').addEventListener('click', async () => {
            updateStatusIndicator('permission-status', 'pending', '正在演示权限控制...');
            
            try {
                const { permissionService, VisibilityLevels, ContentTypes, UserRoles } = 
                    await import('./js/services/permissions.js');
                
                const demoContentId = 'demo_moment_' + Date.now();
                
                // 1. 设置内容权限为朋友可见
                const setResult = await permissionService.setContentPermission(
                    demoContentId, ContentTypes.MOMENT, 
                    { visibility: VisibilityLevels.FRIENDS }
                );
                
                if (!setResult.success) {
                    throw new Error('设置权限失败: ' + setResult.error);
                }
                
                // 2. 测试不同角色的访问权限
                const selfCheck = await permissionService.checkPermission(
                    demoContentId, ContentTypes.MOMENT, 'user', UserRoles.SELF
                );
                
                const friendCheck = await permissionService.checkPermission(
                    demoContentId, ContentTypes.MOMENT, 'ai_friend', UserRoles.AI_FRIEND
                );
                
                const strangerCheck = await permissionService.checkPermission(
                    demoContentId, ContentTypes.MOMENT, 'ai_stranger', UserRoles.AI_STRANGER
                );
                
                const resultText = `
                    自己访问: ${selfCheck.data?.granted ? '✅允许' : '❌拒绝'}
                    AI朋友访问: ${friendCheck.data?.granted ? '✅允许' : '❌拒绝'}  
                    AI陌生人访问: ${strangerCheck.data?.granted ? '✅允许' : '❌拒绝'}
                `.trim();
                
                updateStatusIndicator('permission-status', 'success', '权限控制演示完成');
                console.log('权限测试结果:\n' + resultText);
                
            } catch (error) {
                updateStatusIndicator('permission-status', 'error', `权限演示失败: ${error.message}`);
                console.error('权限演示错误:', error);
            }
        });

        // 重置按钮
        document.getElementById('reset-all').addEventListener('click', () => {
            consoleDiv.textContent = '系统已重置，等待新的验证...\n';
            
            // 重置所有状态指示器
            ['plugin-status', 'behavior-status', 'permission-status', 'event-status'].forEach(id => {
                const element = document.getElementById(id);
                if (element) element.innerHTML = '';
            });
            
            // 重置进度条
            document.getElementById('overall-progress').style.width = '0%';
            document.getElementById('results-details').innerHTML = '<p>尚未开始验证</p>';
            
            // 重置按钮
            const startButton = document.getElementById('start-validation');
            startButton.className = 'btn btn-primary btn-lg';
            startButton.textContent = '🚀 开始验证';
            startButton.disabled = false;
            
            // 重置性能结果
            document.getElementById('performance-results').innerHTML = 
                '<p>点击"性能测试"按钮查看系统性能指标</p>';
        });

        // 页面加载时初始化
        console.log('第二阶段验证页面已加载');
        updateStats();
        
        // 定期更新统计数据
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
