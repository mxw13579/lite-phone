<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PR2测试 - 常量模块</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <h1>PR2测试：常量模块验证</h1>
    <div id="test-results">测试中...</div>
    
    <script type="module" src="./main.js"></script>
    
    <script>
        setTimeout(() => {
            const output = document.getElementById('test-results');
            let results = [];
            
            // 测试1: window.CONSTANTS对象存在
            if (window.CONSTANTS) {
                results.push('✅ window.CONSTANTS 对象存在');
            } else {
                results.push('❌ window.CONSTANTS 对象不存在');
                output.innerHTML = results.join('<br>');
                return;
            }
            
            // 测试2: 提示词常量
            const prompts = [
                'DEFAULT_PROMPT_IMAGE',
                'DEFAULT_PROMPT_VOICE', 
                'DEFAULT_PROMPT_TRANSFER',
                'DEFAULT_PROMPT_SINGLE',
                'DEFAULT_PROMPT_GROUP'
            ];
            let promptCount = 0;
            prompts.forEach(p => {
                if (window.CONSTANTS[p] && window.CONSTANTS[p].length > 10) {
                    promptCount++;
                }
            });
            results.push(`✅ 提示词常量: ${promptCount}/${prompts.length} 个可用`);
            
            // 测试3: 头像常量
            const avatars = [
                'DEFAULT_AVATAR',
                'DEFAULT_MY_GROUP_AVATAR',
                'DEFAULT_GROUP_MEMBER_AVATAR', 
                'DEFAULT_GROUP_AVATAR'
            ];
            let avatarCount = 0;
            avatars.forEach(a => {
                if (window.CONSTANTS[a] && window.CONSTANTS[a].includes('postimg.cc')) {
                    avatarCount++;
                }
            });
            results.push(`✅ 头像常量: ${avatarCount}/${avatars.length} 个可用`);
            
            // 测试4: 其他常量
            if (window.CONSTANTS.STICKER_REGEX && window.CONSTANTS.STICKER_REGEX instanceof RegExp) {
                results.push('✅ STICKER_REGEX 正则表达式可用');
            } else {
                results.push('❌ STICKER_REGEX 不可用');
            }
            
            if (window.CONSTANTS.MESSAGE_RENDER_WINDOW === 50) {
                results.push('✅ MESSAGE_RENDER_WINDOW 常量正确');
            } else {
                results.push('❌ MESSAGE_RENDER_WINDOW 常量不正确');
            }
            
            // 测试5: 常量内容长度验证
            if (window.CONSTANTS.DEFAULT_PROMPT_SINGLE.length > 1000) {
                results.push('✅ 提示词内容完整性检查通过');
            } else {
                results.push('❌ 提示词内容可能不完整');
            }
            
            output.innerHTML = results.join('<br>');
        }, 1500);
    </script>
</body>
</html>
