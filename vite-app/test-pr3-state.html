<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR3 测试 - 状态管理模块</title>
    <style>
        body {
            font-family: 'Segoe UI', Taurus, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .test-result {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 12px;
        }
        
        .success {
            border-left: 4px solid #4CAF50;
        }
        
        .error {
            border-left: 4px solid #f44336;
        }
        
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .status {
            text-align: center;
            font-size: 24px;
            margin: 20px 0;
        }
        
        .mini-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🧠 PR3 测试: 状态管理模块迁移验证</h1>
    
    <div class="status" id="status">
        ⏳ 正在加载状态管理模块...
    </div>

    <div class="test-section">
        <h2>📊 基础类型验证</h2>
        <div id="type-tests"></div>
        <button onclick="runTypeTests()">运行类型测试</button>
    </div>

    <div class="test-section">
        <h2>🔗 window注入验证</h2>
        <div id="window-tests"></div>
        <button onclick="runWindowTests()">测试window注入</button>
    </div>

    <div class="test-section">
        <h2>⚙️ 状态更新函数验证</h2>
        <div id="state-update-tests"></div>
        <button onclick="runStateUpdateTests()">测试状态更新</button>
    </div>

    <div class="test-section">
        <h2>🎯 核心状态操作验证</h2>
        <div id="core-state-tests"></div>
        <button onclick="runCoreStateTests()">测试核心状态</button>
    </div>

    <div class="test-section">
        <h2>🔍 状态查询验证</h2>
        <div id="query-tests"></div>
        <button onclick="runQueryTests()">测试查询函数</button>
    </div>

    <div class="test-section">
        <h2>🎵 辅助状态验证</h2>
        <div id="auxiliary-tests"></div>
        <button onclick="runAuxiliaryTests()">测试辅助状态</button>
    </div>

    <script type="module">
        let STATE_MODULE;
        
        // 动态导入状态管理模块
        try {
            const module = await import('./src/state/index.ts');
            STATE_MODULE = module.default;
            
            document.getElementById('status').innerHTML = '✅ 状态管理模块加载成功!';
            console.log('State module loaded:', STATE_MODULE);
            console.log('Window state:', window.state);
            
            // 自动运行所有测试
            setTimeout(() => {
                runTypeTests();
                runWindowTests();
                runStateUpdateTests();
                runCoreStateTests();
                runQueryTests();
                runAuxiliaryTests();
            }, 1000);
            
        } catch (error) {
            document.getElementById('status').innerHTML = '❌ 状态管理模块加载失败!';
            console.error('Failed to load state:', error);
        }

        // 测试工具函数
        function createTestResult(name, success, details) {
            return `<div class="test-result ${success ? 'success' : 'error'}">
                <strong>${success ? '✅' : '❌'} ${name}</strong>
                ${details ? `\n${details}` : ''}
            </div>`;
        }

        // 基础类型验证测试
        window.runTypeTests = function() {
            let html = '';
            
            try {
                // 测试模块导出
                const hasState = !!(STATE_MODULE && STATE_MODULE.state);
                html += createTestResult('模块导出', hasState, hasState ? '状态对象成功导出' : '状态对象导出失败');
                
                // 测试核心状态结构
                if (hasState) {
                    const requiredStateKeys = ['chats', 'activeChatId', 'globalSettings', 'apiConfig', 'userStickers', 'worldBooks', 'personaPresets', 'presets'];
                    const state = STATE_MODULE.state;
                    
                    let missingKeys = [];
                    requiredStateKeys.forEach(key => {
                        if (!(key in state)) {
                            missingKeys.push(key);
                        }
                    });
                    
                    const stateComplete = missingKeys.length === 0;
                    html += createTestResult(
                        '状态结构完整性', 
                        stateComplete, 
                        stateComplete ? '所有必要状态字段都存在' : `缺失字段: ${missingKeys.join(', ')}`
                    );
                    
                    // 测试状态初始值
                    const initialValues = {
                        'chats is object': typeof state.chats === 'object',
                        'activeChatId is null': state.activeChatId === null,
                        'userStickers is array': Array.isArray(state.userStickers),
                        'worldBooks is array': Array.isArray(state.worldBooks),
                        'presets is array': Array.isArray(state.presets),
                        'personaPresets is array': Array.isArray(state.personaPresets)
                    };
                    
                    const invalidInitials = Object.entries(initialValues).filter(([_, valid]) => !valid).map(([name, _]) => name);
                    const initialsValid = invalidInitials.length === 0;
                    
                    html += createTestResult(
                        '初始值类型检查',
                        initialsValid,
                        initialsValid ? '所有初始值类型正确' : `错误的初始值: ${invalidInitials.join(', ')}`
                    );
                }
                
                // 测试音乐状态
                const musicState = STATE_MODULE.musicState;
                const musicValid = musicState && 
                    typeof musicState.isActive === 'boolean' &&
                    Array.isArray(musicState.playlist) &&
                    typeof musicState.currentIndex === 'number';
                
                html += createTestResult(
                    '音乐状态结构',
                    musicValid,
                    musicValid ? '音乐状态结构正确' : '音乐状态结构异常'
                );
                
            } catch (error) {
                html += createTestResult('类型测试异常', false, error.message);
            }
            
            document.getElementById('type-tests').innerHTML = html;
        };

        // window注入验证测试
        window.runWindowTests = function() {
            let html = '';
            
            try {
                // 测试核心对象注入
                const windowHasState = !!(window.state);
                html += createTestResult(
                    'window.state注入', 
                    windowHasState, 
                    windowHasState ? 'window.state已成功注入' : 'window.state注入失败'
                );
                
                // 测试核心函数注入
                const coreFunctions = [
                    'setActiveChatId',
                    'updateGlobalSettings', 
                    'getActiveChat',
                    'isGroupChat',
                    'getFullState'
                ];
                
                let missingFunctions = [];
                coreFunctions.forEach(fn => {
                    if (typeof window[fn] !== 'function') {
                        missingFunctions.push(fn);
                    }
                });
                
                const functionsComplete = missingFunctions.length === 0;
                html += createTestResult(
                    '核心函数注入',
                    functionsComplete,
                    functionsComplete ? '所有核心函数已注入' : `缺失函数: ${missingFunctions.join(', ')}`
                );
                
                // 测试扩展函数注入
                const extendedFunctions = [
                    'setMyAddress',
                    'updateChat',
                    'removeChat',
                    'addUserSticker',
                    'addWorldBook',
                    'addPreset'
                ];
                
                let missingExtended = [];
                extendedFunctions.forEach(fn => {
                    if (typeof window[fn] !== 'function') {
                        missingExtended.push(fn);
                    }
                });
                
                const extendedComplete = missingExtended.length === 0;
                html += createTestResult(
                    '扩展函数注入',
                    extendedComplete,
                    extendedComplete ? '所有扩展函数已注入' : `缺失函数: ${missingExtended.join(', ')}`
                );
                
                // 测试状态内容一致性
                if (windowHasState && STATE_MODULE.state) {
                    const windowKeys = Object.keys(window.state).sort();
                    const moduleKeys = Object.keys(STATE_MODULE.state).sort();
                    const keysMatch = JSON.stringify(windowKeys) === JSON.stringify(moduleKeys);
                    
                    html += createTestResult(
                        '状态内容一致性',
                        keysMatch,
                        keysMatch ? 'window.state与模块状态一致' : `键不匹配，window: ${windowKeys.join(',')}, module: ${moduleKeys.join(',')}`
                    );
                }
                
            } catch (error) {
                html += createTestResult('window注入测试异常', false, error.message);
            }
            
            document.getElementById('window-tests').innerHTML = html;
        };

        // 状态更新函数验证
        window.runStateUpdateTests = function() {
            let html = '';
            
            try {
                // 测试setActiveChatId
                const originalChatId = window.state.activeChatId;
                window.setActiveChatId('test-chat-1');
                const chatIdSet = window.state.activeChatId === 'test-chat-1';
                window.setActiveChatId(originalChatId); // 恢复原值
                
                html += createTestResult(
                    'setActiveChatId功能',
                    chatIdSet,
                    chatIdSet ? '激活聊天ID设置成功' : '激活聊天ID设置失败'
                );
                
                // 测试updateGlobalSettings
                const testSettings = { testKey: 'testValue', enableGeolocation: true };
                window.updateGlobalSettings(testSettings);
                const settingsUpdated = window.state.globalSettings.testKey === 'testValue' &&
                                      window.state.globalSettings.enableGeolocation === true;
                
                html += createTestResult(
                    'updateGlobalSettings功能',
                    settingsUpdated,
                    settingsUpdated ? '全局设置更新成功' : '全局设置更新失败'
                );
                
                // 测试地址设置
                const originalAddress = window.myAddress();
                window.setMyAddress('测试城市');
                const addressSet = window.myAddress() === '测试城市';
                window.setMyAddress(originalAddress); // 恢复原值
                
                html += createTestResult(
                    'setMyAddress功能',
                    addressSet,
                    addressSet ? '地址设置成功' : '地址设置失败'
                );
                
                // 测试用户贴纸操作
                const originalStickers = [...window.state.userStickers];
                const testSticker = { id: 'test-sticker', url: 'test://url', name: 'Test Sticker' };
                
                window.addUserSticker(testSticker);
                const stickerAdded = window.state.userStickers.some(s => s.id === 'test-sticker');
                
                window.removeUserSticker('test-sticker');
                const stickerRemoved = !window.state.userStickers.some(s => s.id === 'test-sticker');
                
                window.setUserStickers(originalStickers); // 恢复原值
                
                html += createTestResult(
                    '用户贴纸CRUD',
                    stickerAdded && stickerRemoved,
                    stickerAdded && stickerRemoved ? '贴纸添加和删除成功' : `添加:${stickerAdded}, 删除:${stickerRemoved}`
                );
                
            } catch (error) {
                html += createTestResult('状态更新测试异常', false, error.message);
            }
            
            document.getElementById('state-update-tests').innerHTML = html;
        };

        // 核心状态操作验证
        window.runCoreStateTests = function() {
            let html = '';
            
            try {
                // 创建测试聊天
                const testChat = {
                    id: 'test-chat-core',
                    name: '测试聊天',
                    isGroup: false,
                    settings: {
                        aiPersona: '测试AI',
                        myPersona: '测试用户',
                        maxMemory: 10
                    },
                    history: [],
                    musicData: { totalTime: 0 }
                };
                
                // 测试聊天操作
                window.updateChat('test-chat-core', testChat);
                const chatExists = !!(window.state.chats['test-chat-core']);
                const chatData = window.state.chats['test-chat-core'];
                const chatValid = chatExists && chatData.name === '测试聊天' && !chatData.isGroup;
                
                html += createTestResult(
                    '聊天创建',
                    chatValid,
                    chatValid ? '测试聊天创建成功' : '测试聊天创建失败'
                );
                
                // 测试聊天更新
                window.updateChat('test-chat-core', { name: '更新后的聊天' });
                const chatUpdated = window.state.chats['test-chat-core'].name === '更新后的聊天';
                
                html += createTestResult(
                    '聊天更新',
                    chatUpdated,
                    chatUpdated ? '聊天更新成功' : '聊天更新失败'
                );
                
                // 测试聊天删除
                window.removeChat('test-chat-core');
                const chatRemoved = !window.state.chats['test-chat-core'];
                
                html += createTestResult(
                    '聊天删除',
                    chatRemoved,
                    chatRemoved ? '聊天删除成功' : '聊天删除失败'
                );
                
                // 测试世界书操作
                const originalWorldBooks = [...window.state.worldBooks];
                const testWorldBook = {
                    id: 'test-world-book',
                    name: '测试世界书',
                    content: '测试内容'
                };
                
                window.addWorldBook(testWorldBook);
                const worldBookAdded = window.state.worldBooks.some(wb => wb.id === 'test-world-book');
                
                window.updateWorldBook('test-world-book', { name: '更新的世界书' });
                const worldBookUpdated = window.state.worldBooks.find(wb => wb.id === 'test-world-book')?.name === '更新的世界书';
                
                window.removeWorldBook('test-world-book');
                const worldBookRemoved = !window.state.worldBooks.some(wb => wb.id === 'test-world-book');
                
                window.setWorldBooks(originalWorldBooks); // 恢复原值
                
                html += createTestResult(
                    '世界书CRUD',
                    worldBookAdded && worldBookUpdated && worldBookRemoved,
                    `添加:${worldBookAdded}, 更新:${worldBookUpdated}, 删除:${worldBookRemoved}`
                );
                
            } catch (error) {
                html += createTestResult('核心状态测试异常', false, error.message);
            }
            
            document.getElementById('core-state-tests').innerHTML = html;
        };

        // 状态查询验证
        window.runQueryTests = function() {
            let html = '';
            
            try {
                // 创建测试场景
                const testChat = {
                    id: 'query-test-chat',
                    name: '查询测试聊天',
                    isGroup: true,
                    settings: { aiPersona: 'Test AI' },
                    history: [],
                    musicData: { totalTime: 0 }
                };
                
                window.updateChat('query-test-chat', testChat);
                window.setActiveChatId('query-test-chat');
                
                // 测试getActiveChat
                const activeChat = window.getActiveChat();
                const activeChatValid = activeChat && activeChat.id === 'query-test-chat' && activeChat.name === '查询测试聊天';
                
                html += createTestResult(
                    'getActiveChat功能',
                    activeChatValid,
                    activeChatValid ? `当前聊天: ${activeChat?.name}` : '获取当前聊天失败'
                );
                
                // 测试isGroupChat
                const isGroup = window.isGroupChat();
                const groupCheckValid = isGroup === true; // 我们设置的是群聊
                
                html += createTestResult(
                    'isGroupChat功能',
                    groupCheckValid,
                    groupCheckValid ? '群聊检测正确' : `群聊检测错误，期望true，得到${isGroup}`
                );
                
                // 测试带参数的isGroupChat
                const isGroupWithParam = window.isGroupChat('query-test-chat');
                const paramCheckValid = isGroupWithParam === true;
                
                html += createTestResult(
                    'isGroupChat(带参数)',
                    paramCheckValid,
                    paramCheckValid ? '带参数的群聊检测正确' : `带参数的群聊检测错误`
                );
                
                // 测试getFullState
                const fullState = window.getFullState();
                const fullStateValid = fullState && 
                                    fullState.state && 
                                    fullState.musicState &&
                                    fullState.editStates &&
                                    fullState.renderState &&
                                    typeof fullState.myAddress === 'string';
                
                html += createTestResult(
                    'getFullState功能',
                    fullStateValid,
                    fullStateValid ? `完整状态包含: ${Object.keys(fullState).join(', ')}` : '获取完整状态失败'
                );
                
                // 清理测试数据
                window.removeChat('query-test-chat');
                window.setActiveChatId(null);
                
            } catch (error) {
                html += createTestResult('查询测试异常', false, error.message);
            }
            
            document.getElementById('query-tests').innerHTML = html;
        };

        // 辅助状态验证
        window.runAuxiliaryTests = function() {
            let html = '';
            
            try {
                // 测试音乐状态
                const originalMusicState = { ...window.musicState };
                
                window.setMusicActive('test-music-chat');
                const musicActivated = window.musicState.isActive === true && 
                                     window.musicState.activeChatId === 'test-music-chat';
                
                html += createTestResult(
                    '音乐状态激活',
                    musicActivated,
                    musicActivated ? `音乐已激活，聊天ID: ${window.musicState.activeChatId}` : '音乐状态激活失败'
                );
                
                window.setMusicInactive();
                const musicDeactivated = window.musicState.isActive === false && 
                                        window.musicState.activeChatId === null &&
                                        window.musicState.isPlaying === false;
                
                html += createTestResult(
                    '音乐状态停用',
                    musicDeactivated,
                    musicDeactivated ? '音乐状态成功停用' : '音乐状态停用失败'
                );
                
                // 测试编辑状态
                window.setMessageEditMode(true);
                const editModeOn = window.isMessageEditMode === true;
                
                window.setMessageEditMode(false);
                const editModeOff = window.isMessageEditMode === false;
                
                html += createTestResult(
                    '消息编辑模式',
                    editModeOn && editModeOff,
                    `编辑模式切换: 开启(${editModeOn}), 关闭(${editModeOff})`
                );
                
                // 测试预设编辑状态
                window.setEditingPresetId('test-preset-id');
                const presetIdSet = window.editingPresetId === 'test-preset-id';
                
                window.setEditingPresetId(null);
                const presetIdCleared = window.editingPresetId === null;
                
                html += createTestResult(
                    '预设编辑状态',
                    presetIdSet && presetIdCleared,
                    `预设编辑状态: 设置(${presetIdSet}), 清除(${presetIdCleared})`
                );
                
                // 测试选择模式
                window.setSelectionMode(true);
                const selectionOn = window.isSelectionMode === true;
                
                window.setSelectionMode(false);
                const selectionOff = window.isSelectionMode === false;
                
                html += createTestResult(
                    '选择模式',
                    selectionOn && selectionOff,
                    `选择模式切换: 开启(${selectionOn}), 关闭(${selectionOff})`
                );
                
            } catch (error) {
                html += createTestResult('辅助状态测试异常', false, error.message);
            }
            
            document.getElementById('auxiliary-tests').innerHTML = html;
        };
        
        // 全局错误处理
        window.onerror = function(msg, url, line, col, error) {
            console.error('Global error:', { msg, url, line, col, error });
            document.getElementById('status').innerHTML = '❌ 测试过程中发生错误!';
        };
    </script>
</body>
</html>
