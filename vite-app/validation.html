<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPhone Vite+TS 验证页面</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-card {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #4CAF50;
        }
        .status-card.error {
            border-left-color: #f44336;
        }
        .status-card.warning {
            border-left-color: #ff9800;
        }
        .console-output {
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
            padding: 20px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 EPhone Vite+TypeScript 迁移验证</h1>
            <p>PR1-PR11 完整性检验与功能等价性验证</p>
        </div>

        <div class="status-grid">
            <div class="status-card" id="modules-status">
                <h3>📦 模块加载状态</h3>
                <div id="modules-info">检测中...</div>
            </div>
            <div class="status-card" id="api-status">
                <h3>🔗 API兼容性</h3>
                <div id="api-info">检测中...</div>
            </div>
            <div class="status-card" id="database-status">
                <h3>💾 数据库状态</h3>
                <div id="database-info">检测中...</div>
            </div>
            <div class="status-card" id="services-status">
                <h3>⚙️ 服务状态</h3>
                <div id="services-info">检测中...</div>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <h3>🧪 验证操作</h3>
            <button class="btn" onclick="runFullValidation()">运行完整验证</button>
            <button class="btn" onclick="runStateComparison()">状态对比</button>
            <button class="btn" onclick="exportValidationReport()">导出报告</button>
            <button class="btn" onclick="clearConsole()">清空控制台</button>
        </div>

        <div>
            <h3>📊 验证进度</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
            </div>
            <div id="progress-text">准备验证...</div>
        </div>

        <div>
            <h3>💻 控制台输出</h3>
            <div class="console-output" id="console-output"></div>
        </div>
    </div>

    <!-- 引入状态对比工具 -->
    <script type="module" src="./src/scripts/compare-state.ts"></script>

    <script type="module">
        // 导入所有模块并验证
        import('./src/main.ts').then(mainModule => {
            log('✅ 主模块加载成功');
            startValidation();
        }).catch(error => {
            log('❌ 主模块加载失败: ' + error.message);
            updateModuleStatus('error', '主模块加载失败');
        });

        let validationResults = {};
        
        function log(message, type = 'info') {
            const output = document.getElementById('console-output');
            const timestamp = new Date().toLocaleTimeString();
            const colorMap = {
                'error': '#ff6b6b',
                'success': '#51cf66',
                'warning': '#ffd43b',
                'info': '#74c0fc'
            };
            
            const logEntry = document.createElement('div');
            logEntry.style.color = colorMap[type] || '#ffffff';
            logEntry.textContent = `[${timestamp}] ${message}`;
            output.appendChild(logEntry);
            output.scrollTop = output.scrollHeight;
            
            // 同时输出到浏览器控制台
            console.log(message);
        }

        function updateProgress(percentage, text) {
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            progressBar.style.width = percentage + '%';
            progressText.textContent = text;
        }

        function updateModuleStatus(status, info) {
            const card = document.getElementById('modules-status');
            const infoDiv = document.getElementById('modules-info');
            card.className = 'status-card ' + status;
            infoDiv.innerHTML = info;
        }

        function updateApiStatus(status, info) {
            const card = document.getElementById('api-status');
            const infoDiv = document.getElementById('api-info');
            card.className = 'status-card ' + status;
            infoDiv.innerHTML = info;
        }

        function updateDatabaseStatus(status, info) {
            const card = document.getElementById('database-status');
            const infoDiv = document.getElementById('database-info');
            card.className = 'status-card ' + status;
            infoDiv.innerHTML = info;
        }

        function updateServicesStatus(status, info) {
            const card = document.getElementById('services-status');
            const infoDiv = document.getElementById('services-info');
            card.className = 'status-card ' + status;
            infoDiv.innerHTML = info;
        }

        async function startValidation() {
            log('🚀 开始 EPhone Vite+TS 版本验证...');
            updateProgress(10, '等待应用初始化...');

            // 等待应用完全加载
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            updateProgress(25, '检查模块加载...');
            await checkModules();
            
            updateProgress(45, '验证API兼容性...');
            await checkApiCompatibility();
            
            updateProgress(65, '检查数据库连接...');
            await checkDatabase();
            
            updateProgress(85, '验证服务功能...');
            await checkServices();
            
            updateProgress(100, '验证完成');
            log('🎉 验证流程完成！');
            
            // 生成最终报告
            generateFinalReport();
        }

        async function checkModules() {
            const modules = [
                { name: 'CONSTANTS', obj: window.CONSTANTS },
                { name: 'STATE', obj: window.STATE },
                { name: 'DB', obj: window.DB },
                { name: 'ROUTER', obj: window.ROUTER }
            ];

            const results = modules.map(module => {
                const loaded = !!module.obj;
                const keyCount = loaded ? Object.keys(module.obj).length : 0;
                return { name: module.name, loaded, keyCount };
            });

            const allLoaded = results.every(r => r.loaded);
            const totalKeys = results.reduce((sum, r) => sum + r.keyCount, 0);

            if (allLoaded) {
                updateModuleStatus('success', `✅ 所有核心模块已加载<br>总计: ${totalKeys} 个导出项`);
                log(`✅ 模块检查通过 - 4个核心模块，${totalKeys}个导出项`);
                validationResults.modules = { status: 'pass', details: results };
            } else {
                const failed = results.filter(r => !r.loaded).map(r => r.name);
                updateModuleStatus('error', `❌ 模块加载失败: ${failed.join(', ')}`);
                log(`❌ 模块检查失败 - 未加载: ${failed.join(', ')}`, 'error');
                validationResults.modules = { status: 'fail', details: results };
            }
        }

        async function checkApiCompatibility() {
            const requiredAPIs = [
                'setActiveChatId', 'updateGlobalSettings', 'getActiveChat', 'isGroupChat',
                'loadAllDataFromDB', 'initializeDatabase', 'showScreen', 'navigateToChat',
                'showCustomModal', 'exportData', 'togglePlayPause', 'openPersonaLibrary'
            ];

            const apiResults = requiredAPIs.map(api => ({
                name: api,
                available: typeof window[api] === 'function'
            }));

            const availableCount = apiResults.filter(r => r.available).length;
            const compatibilityRate = Math.round((availableCount / requiredAPIs.length) * 100);

            if (compatibilityRate === 100) {
                updateApiStatus('success', `✅ 向后兼容性: 100%<br>${availableCount}/${requiredAPIs.length} APIs可用`);
                log(`✅ API兼容性检查通过 - ${availableCount}/${requiredAPIs.length}`, 'success');
                validationResults.api = { status: 'pass', compatibility: compatibilityRate, details: apiResults };
            } else if (compatibilityRate >= 80) {
                updateApiStatus('warning', `⚠️ 向后兼容性: ${compatibilityRate}%<br>${availableCount}/${requiredAPIs.length} APIs可用`);
                log(`⚠️ API兼容性有缺陷 - ${availableCount}/${requiredAPIs.length}`, 'warning');
                validationResults.api = { status: 'partial', compatibility: compatibilityRate, details: apiResults };
            } else {
                updateApiStatus('error', `❌ 向后兼容性: ${compatibilityRate}%<br>${availableCount}/${requiredAPIs.length} APIs可用`);
                log(`❌ API兼容性严重缺失 - ${availableCount}/${requiredAPIs.length}`, 'error');
                validationResults.api = { status: 'fail', compatibility: compatibilityRate, details: apiResults };
            }
        }

        async function checkDatabase() {
            try {
                if (!window.DB?.db) {
                    throw new Error('数据库实例未初始化');
                }

                const db = window.DB.db;
                const tables = db.tables || [];
                const tableNames = tables.map(t => t.name);
                
                log(`🔍 发现 ${tables.length} 个数据表: ${tableNames.join(', ')}`);

                // 尝试基本CRUD操作
                const testOperations = [
                    { name: 'getAllChats', fn: window.getAllChats },
                    { name: 'getGlobalSettings', fn: window.getGlobalSettings },
                    { name: 'getAllWorldBooks', fn: window.getAllWorldBooks }
                ];

                let operationsWorking = 0;
                for (const op of testOperations) {
                    try {
                        if (typeof op.fn === 'function') {
                            await op.fn();
                            operationsWorking++;
                            log(`  ✅ ${op.name} 操作正常`);
                        }
                    } catch (err) {
                        log(`  ❌ ${op.name} 操作失败: ${err.message}`, 'error');
                    }
                }

                if (operationsWorking === testOperations.length) {
                    updateDatabaseStatus('success', `✅ 数据库连接正常<br>${tables.length}个表，${operationsWorking}个操作正常`);
                    validationResults.database = { status: 'pass', tablesCount: tables.length, operations: operationsWorking };
                } else {
                    updateDatabaseStatus('warning', `⚠️ 部分操作异常<br>${tables.length}个表，${operationsWorking}/${testOperations.length}操作正常`);
                    validationResults.database = { status: 'partial', tablesCount: tables.length, operations: operationsWorking };
                }
            } catch (error) {
                updateDatabaseStatus('error', `❌ 数据库错误<br>${error.message}`);
                log(`❌ 数据库检查失败: ${error.message}`, 'error');
                validationResults.database = { status: 'fail', error: error.message };
            }
        }

        async function checkServices() {
            const services = [
                { name: 'UI工具', check: () => typeof window.showCustomModal === 'function' },
                { name: '电池管理', check: () => typeof window.initBatteryManager === 'function' },
                { name: '数据管理', check: () => typeof window.exportData === 'function' },
                { name: '音乐服务', check: () => typeof window.togglePlayPause === 'function' },
                { name: '人设服务', check: () => typeof window.openPersonaLibrary === 'function' }
            ];

            const serviceResults = services.map(service => ({
                name: service.name,
                available: service.check()
            }));

            const workingCount = serviceResults.filter(r => r.available).length;
            const serviceRate = Math.round((workingCount / services.length) * 100);

            if (serviceRate === 100) {
                updateServicesStatus('success', `✅ 所有服务可用<br>${workingCount}/${services.length} 服务正常`);
                log(`✅ 服务检查通过 - ${workingCount}/${services.length}`, 'success');
                validationResults.services = { status: 'pass', rate: serviceRate, details: serviceResults };
            } else if (serviceRate >= 80) {
                updateServicesStatus('warning', `⚠️ 部分服务异常<br>${workingCount}/${services.length} 服务正常`);
                log(`⚠️ 服务部分可用 - ${workingCount}/${services.length}`, 'warning');
                validationResults.services = { status: 'partial', rate: serviceRate, details: serviceResults };
            } else {
                updateServicesStatus('error', `❌ 服务严重异常<br>${workingCount}/${services.length} 服务正常`);
                log(`❌ 服务大量失效 - ${workingCount}/${services.length}`, 'error');
                validationResults.services = { status: 'fail', rate: serviceRate, details: serviceResults };
            }
        }

        function generateFinalReport() {
            const overallScore = calculateOverallScore();
            log('📊 ============ 最终验证报告 ============');
            log(`🎯 综合评分: ${overallScore}/100`);
            
            Object.entries(validationResults).forEach(([key, result]) => {
                const status = result.status === 'pass' ? '✅' : result.status === 'partial' ? '⚠️' : '❌';
                log(`${status} ${key.toUpperCase()}: ${result.status.toUpperCase()}`);
            });

            if (overallScore >= 90) {
                log('🎉 迁移质量优秀！可以安全切换到Vite+TS版本', 'success');
            } else if (overallScore >= 70) {
                log('⚠️ 迁移基本成功，但有一些问题需要修复', 'warning');
            } else {
                log('❌ 迁移存在严重问题，需要进一步调试', 'error');
            }

            log('📋 完整报告已保存到 window.validationResults');
            window.validationResults = validationResults;
        }

        function calculateOverallScore() {
            let score = 0;
            let maxScore = 0;

            Object.values(validationResults).forEach(result => {
                maxScore += 25;
                if (result.status === 'pass') score += 25;
                else if (result.status === 'partial') score += 15;
                // fail gets 0 points
            });

            return Math.round((score / maxScore) * 100);
        }

        // 全局函数
        window.runFullValidation = async function() {
            document.getElementById('console-output').innerHTML = '';
            validationResults = {};
            await startValidation();
            
            // 自动运行验证矩阵
            if (typeof window.runValidationMatrix === 'function') {
                log('🧪 运行功能验证矩阵...');
                const matrixResult = window.runValidationMatrix();
                validationResults.matrix = matrixResult;
            }
        };

        window.runStateComparison = function() {
            if (typeof window.executeStateComparison === 'function') {
                log('🔄 开始状态对比验证...');
                window.executeStateComparison().then(result => {
                    log('✅ 状态对比完成');
                    validationResults.stateComparison = result;
                });
            } else {
                log('❌ 状态对比工具未加载', 'error');
            }
        };

        window.exportValidationReport = function() {
            const reportData = {
                timestamp: new Date().toISOString(),
                version: 'Vite+TypeScript',
                results: validationResults,
                summary: {
                    overallScore: calculateOverallScore(),
                    totalTests: Object.keys(validationResults).length,
                    passedTests: Object.values(validationResults).filter(r => r.status === 'pass').length
                }
            };

            const blob = new Blob([JSON.stringify(reportData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ephone-validation-report-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            log('📥 验证报告已导出');
        };

        window.clearConsole = function() {
            document.getElementById('console-output').innerHTML = '';
            log('🧹 控制台已清空');
        };
    </script>
</body>
</html>
